{% extends 'base.html' %}
{% block title %}Profile · TAPSI{% endblock %}
{% block content %}
<section class="profile-card">
    <h1>Your profile</h1>
    {% if user.avatar %}
    <div style="text-align: center; margin-bottom: var(--space-6);">
        <img src="{{ user.avatar.url }}" alt="Your avatar" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--tapsi-200);">
    </div>
    {% endif %}
    <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        {% for field in form %}
        <div class="field">
            {{ field.label_tag }}
            {{ field }}
            {{ field.errors }}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary" style="width: 100%;">Save profile</button>
    </form>
    <div style="text-align: center; margin-top: var(--space-6); padding-top: var(--space-6); border-top: 1px solid var(--gray-100);">
        <a href="{% url 'accounts:request_email_change' %}" style="margin-right: var(--space-4);">Change email address</a>
        <a href="{% url 'accounts:change_password' %}">Change password</a>
    </div>
</section>
{% endblock %}
