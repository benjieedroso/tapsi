{% extends 'base.html' %}
{% block title %}Profile · TAPSI{% endblock %}
{% block content %}
<section class="profile-card">
    <h1>Your profile</h1>
    {% if user.avatar %}
    <img class="profile-avatar" src="{{ user.avatar.url }}" alt="Your avatar">
    {% endif %}
    <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        {% for field in form %}
        <div class="field">
            {{ field.label_tag }}
            {{ field }}
            {{ field.errors }}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary" style="width: 100%;">Save profile</button>
    </form>
    <div class="profile-links">
        <a href="{% url 'accounts:request_email_change' %}">Change email</a>
        <span>·</span>
        <a href="{% url 'accounts:change_password' %}">Change password</a>
    </div>
</section>
{% endblock %}
