{% extends 'base.html' %}{% block title %}Profile · TAPSI{% endblock %}{% block content %}<section class="form-card"><h1>Your profile</h1>{% if user.avatar %}<img class="avatar" src="{{ user.avatar.url }}" alt="Your avatar">{% endif %}<form method="post" enctype="multipart/form-data" novalidate>{% csrf_token %}{% for field in form %}<div class="field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>{% endfor %}<button>Save profile</button></form><p><a href="{% url 'accounts:request_email_change' %}">Change email address</a> · <a href="{% url 'accounts:change_password' %}">Change password</a></p></section>{% endblock %}
